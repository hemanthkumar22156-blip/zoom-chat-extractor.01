<script>

let finalData = [];


/* =========================================================
   FILE UPLOAD
========================================================= */

document
.getElementById("fileInput")
.addEventListener("change", function(event){

    const file = event.target.files[0];

    if(!file){
        return;
    }

    if(
        !file.name.toLowerCase().endsWith(".txt") &&
        file.type !== "text/plain"
    ){

        showMessage(
            "Please upload a Zoom TXT file.",
            true
        );

        return;
    }


    const reader = new FileReader();


    reader.onload = function(e){

        try{

            const text = e.target.result;

            processFile(text);

        }catch(error){

            console.error(error);

            showMessage(
                "Error reading the file. Please check the TXT file.",
                true
            );

        }

    };


    reader.onerror = function(){

        showMessage(
            "Unable to read this file.",
            true
        );

    };


    reader.readAsText(file);

});


/* =========================================================
   PROCESS FILE
========================================================= */

function processFile(text){

    if(!text || !text.trim()){

        showMessage(
            "The uploaded file is empty.",
            true
        );

        return;
    }


    const records = parseChat(text);


    if(records.length === 0){

        showMessage(
            "No Zoom chat messages were detected in this TXT file.",
            true
        );

        return;
    }


    const extracted = [];


    records.forEach(record => {

        const number = getNumber(record.message);


        if(number){

            const status = classifyStatus(record.message);


            extracted.push({

                date: record.date || "",

                time: record.time || "",

                participant: cleanParticipant(
                    record.participant
                ),

                number: number,

                status: status,

                message: record.message,

                fullDateTime:
                    (record.date ? record.date + " " : "") +
                    (record.time || "")

            });

        }

    });


    if(extracted.length === 0){

        finalData = [];

        renderTable();

        showMessage(
            "File uploaded, but no 10-digit Indian mobile number was found. Please check the Zoom TXT format.",
            true
        );

        return;
    }


    finalData = removeDuplicates(extracted);


    sortData();


    renderTable();


    showMessage(
        "File processed successfully. " +
        extracted.length +
        " number occurrence(s) found, " +
        finalData.length +
        " unique number(s) shown.",
        false
    );

}


/* =========================================================
   DETECT ZOOM HEADER
========================================================= */

function detectHeader(line){

    if(!line){
        return null;
    }


    let clean = line
        .replace(/\uFEFF/g, "")
        .trim();


    /*
        FORMAT 1

        2026-09-20 20:11:32 From Nehru Nithi to Hosts and panelists:
    */

    let match = clean.match(
        /^\[?\s*(\d{4}-\d{1,2}-\d{1,2})\s+(\d{1,2}:\d{2}(?::\d{2})?)\s*\]?\s+From\s+(.+?)\s+to\s+(.+?)\s*:\s*(.*)$/i
    );


    if(match){

        return {

            date:match[1],

            time:match[2],

            participant:match[3].trim(),

            recipient:match[4].trim(),

            message:match[5].trim()

        };

    }


    /*
        FORMAT 2

        [20:11:32] From Name to Everyone:
    */

    match = clean.match(
        /^\[?\s*(\d{1,2}:\d{2}(?::\d{2})?)\s*\]?\s+From\s+(.+?)\s+to\s+(.+?)\s*:\s*(.*)$/i
    );


    if(match){

        return {

            date:"",

            time:match[1],

            participant:match[2].trim(),

            recipient:match[3].trim(),

            message:match[4].trim()

        };

    }


    /*
        FORMAT 3

        From Name to Everyone:
    */

    match = clean.match(
        /^From\s+(.+?)\s+to\s+(.+?)\s*:\s*(.*)$/i
    );


    if(match){

        return {

            date:"",

            time:"",

            participant:match[1].trim(),

            recipient:match[2].trim(),

            message:match[3].trim()

        };

    }


    /*
        FORMAT 4

        2026-09-20 20:11:32 - From Name to Everyone:
    */

    match = clean.match(
        /^\[?\s*(\d{4}-\d{1,2}-\d{1,2})\s+(\d{1,2}:\d{2}(?::\d{2})?)\s*\]?\s*[-–—]\s*From\s+(.+?)\s+to\s+(.+?)\s*:\s*(.*)$/i
    );


    if(match){

        return {

            date:match[1],

            time:match[2],

            participant:match[3].trim(),

            recipient:match[4].trim(),

            message:match[5].trim()

        };

    }


    /*
        FORMAT 5

        20:11:32 - From Name to Everyone:
    */

    match = clean.match(
        /^\[?\s*(\d{1,2}:\d{2}(?::\d{2})?)\s*\]?\s*[-–—]\s*From\s+(.+?)\s+to\s+(.+?)\s*:\s*(.*)$/i
    );


    if(match){

        return {

            date:"",

            time:match[1],

            participant:match[2].trim(),

            recipient:match[3].trim(),

            message:match[4].trim()

        };

    }


    return null;

}


/* =========================================================
   PARSE CHAT
========================================================= */

function parseChat(text){

    /*
       Normalize Windows / Mac line endings.
    */

    const lines = text
        .replace(/\r\n/g,"\n")
        .replace(/\r/g,"\n")
        .split("\n");


    const records = [];

    let current = null;


    function saveCurrent(){

        if(!current){
            return;
        }


        current.message = normalizeMessage(
            current.message
        );


        if(
            current.participant ||
            current.message
        ){

            records.push(current);

        }

    }


    for(let i=0; i<lines.length; i++){

        let rawLine = lines[i];

        /*
           Remove BOM only from beginning.
        */

        rawLine = rawLine.replace(/^\uFEFF/,"");


        const header = detectHeader(rawLine);


        if(header){

            /*
               New message found.
               Save previous one first.
            */

            saveCurrent();


            current = {

                date:header.date || "",

                time:header.time || "",

                participant:header.participant || "",

                recipient:header.recipient || "",

                message:header.message || ""

            };


            continue;

        }


        /*
           If current message exists,
           this is a continuation line.

           Example:

           From Dr Prabhakar Raj Team to Everyone:
           For any doubts
           Team : 8925844241
        */

        if(current){

            const continuation =
                rawLine.trim();


            if(continuation){

                if(current.message){

                    current.message +=
                        " " + continuation;

                }else{

                    current.message =
                        continuation;

                }

            }

        }

    }


    /*
       Save final message.
    */

    saveCurrent();


    return records;

}


/* =========================================================
   NORMALIZE MESSAGE
========================================================= */

function normalizeMessage(message){

    return String(message || "")
        .replace(/\s+/g," ")
        .trim();

}


/* =========================================================
   CLEAN PARTICIPANT NAME
========================================================= */

function cleanParticipant(name){

    let value = String(name || "")
        .replace(/\s+/g," ")
        .trim();


    /*
       Remove common accidental prefixes.
    */

    value = value.replace(
        /^From\s+/i,
        ""
    );


    return value;

}


/* =========================================================
   GET PHONE NUMBER
========================================================= */

function getNumber(text){

    if(!text){
        return null;
    }


    let value = String(text);


    /*
       Convert non-breaking spaces.
    */

    value = value.replace(/\u00A0/g," ");


    /*
       First check +91 / 91 format.
    */

    let match = value.match(
        /(?:\+?\s*91)[\s-]*([6-9]\d{4})[\s-]?(\d{5})\b/
    );


    if(match){

        return match[1] + match[2];

    }


    /*
       Indian number with space:

       99446 17313
    */

    match = value.match(
        /\b([6-9]\d{4})[\s-](\d{5})\b/
    );


    if(match){

        return match[1] + match[2];

    }


    /*
       Indian number with hyphen:

       99446-17313
    */

    match = value.match(
        /\b([6-9]\d{4})-(\d{5})\b/
    );


    if(match){

        return match[1] + match[2];

    }


    /*
       Normal 10 digit mobile number.
    */

    match = value.match(
        /\b([6-9]\d{9})\b/
    );


    if(match){

        return match[1];

    }


    /*
       Last fallback:
       Search digit groups and combine.

       This helps with formats such as:

       9944 617 313
       99446 173 13
    */

    const digitGroups =
        value.match(/\d[\d\s-]{7,}\d/g);


    if(digitGroups){

        for(const group of digitGroups){

            const digits =
                group.replace(/\D/g,"");


            /*
               Indian number inside longer text.
            */

            const index =
                digits.search(/[6-9]\d{9}/);


            if(index !== -1){

                return digits.substring(
                    index,
                    index + 10
                );

            }

        }

    }


    return null;

}


/* =========================================================
   STATUS CLASSIFICATION
========================================================= */

function classifyStatus(message){

    const text =
        String(message || "")
        .toLowerCase();


    /*
       HELP has highest priority.
    */

    if(
        /\bhelp\b/i.test(text) ||
        /\bassist\b/i.test(text) ||
        /\bsupport\b/i.test(text) ||
        /உதவி/i.test(text) ||
        /சந்தேகம்/i.test(text) ||
        /doubt/i.test(text)
    ){

        return "Help";

    }


    /*
       TIME category.
    */

    if(
        /\btime\b/i.test(text) ||
        /\bwhen\b/i.test(text) ||
        /\bwhat\s*time\b/i.test(text) ||
        /\btiming\b/i.test(text) ||
        /\bclock\b/i.test(text) ||
        /\bhour\b/i.test(text) ||
        /\bhours\b/i.test(text) ||
        /\bminute\b/i.test(text) ||
        /\bminutes\b/i.test(text) ||
        /\bclass\s*start\b/i.test(text) ||
        /\bstart\s*time\b/i.test(text) ||
        /\bstart\b/i.test(text) ||
        /\bschedule\b/i.test(text) ||
        /நேரம்/i.test(text) ||
        /மணி/i.test(text)
    ){

        return "Time";

    }


    return "Others";

}


/* =========================================================
   REMOVE DUPLICATES
========================================================= */

function removeDuplicates(data){

    const map = new Map();


    data.forEach(item => {

        const key = item.number;


        if(!map.has(key)){

            map.set(key,item);

            return;

        }


        const old = map.get(key);


        /*
           Priority:

           Help = 1
           Time = 2
           Others = 3
        */

        const priority = {

            "Help":1,

            "Time":2,

            "Others":3

        };


        const oldPriority =
            priority[old.status] || 3;


        const newPriority =
            priority[item.status] || 3;


        /*
           Better category wins.
        */

        if(newPriority < oldPriority){

            map.set(key,item);

            return;

        }


        /*
           Same category:
           latest message wins.
        */

        if(newPriority === oldPriority){

            const oldTime =
                getDateTimeValue(old);


            const newTime =
                getDateTimeValue(item);


            if(newTime >= oldTime){

                map.set(key,item);

            }

        }

    });


    return Array.from(map.values());

}


/* =========================================================
   DATE TIME VALUE
========================================================= */

function getDateTimeValue(item){

    let datePart =
        item.date || "1970-01-01";


    /*
       If date format is YYYY-MM-DD,
       this works directly.

       If only time exists,
       it still sorts by time.
    */

    const value =
        (datePart + " " + (item.time || "00:00:00"))
        .trim();


    const parsed =
        new Date(value);


    if(!isNaN(parsed.getTime())){

        return parsed.getTime();

    }


    /*
       Fallback manual time conversion.
    */

    const match =
        String(item.time || "")
        .match(/(\d{1,2}):(\d{2})(?::(\d{2}))?/);


    if(match){

        return (
            Number(match[1]) * 3600 +
            Number(match[2]) * 60 +
            Number(match[3] || 0)
        );

    }


    return 0;

}


/* =========================================================
   SORT DATA
========================================================= */

function sortData(){

    finalData.sort(function(a,b){

        return getDateTimeValue(a) -
               getDateTimeValue(b);

    });

}


/* =========================================================
   RENDER TABLE
========================================================= */

function renderTable(){

    const tbody =
        document.getElementById("resultBody");


    tbody.innerHTML = "";


    if(!finalData.length){

        tbody.innerHTML = `
            <tr>
                <td colspan="5" class="empty">
                    Upload a Zoom TXT file to see results
                </td>
            </tr>
        `;


        updateStats();

        return;
    }


    finalData.forEach(function(item,index){

        const row =
            document.createElement("tr");


        let statusClass =
            "status-others";


        if(item.status === "Help"){

            statusClass =
                "status-help";

        }else if(item.status === "Time"){

            statusClass =
                "status-time";

        }


        row.innerHTML = `

            <td>${index + 1}</td>

            <td>
                ${escapeHTML(
                    formatDateTime(item)
                )}
            </td>

            <td>
                ${escapeHTML(
                    item.participant
                )}
            </td>

            <td class="number">
                ${escapeHTML(
                    item.number
                )}
            </td>

            <td>
                <span class="status ${statusClass}">
                    ${escapeHTML(item.status)}
                </span>
            </td>

        `;


        tbody.appendChild(row);

    });


    updateStats();

}


/* =========================================================
   FORMAT DATE TIME
========================================================= */

function formatDateTime(item){

    if(item.date && item.time){

        return item.date +
            " " +
            item.time;

    }


    return item.time || "";

}


/* =========================================================
   UPDATE STATS
========================================================= */

function updateStats(){

    const help =
        finalData.filter(
            x => x.status === "Help"
        ).length;


    const time =
        finalData.filter(
            x => x.status === "Time"
        ).length;


    const others =
        finalData.filter(
            x => x.status === "Others"
        ).length;


    document.getElementById(
        "uniqueCount"
    ).textContent =
        finalData.length;


    document.getElementById(
        "helpCount"
    ).textContent =
        help;


    document.getElementById(
        "timeCount"
    ).textContent =
        time;


    document.getElementById(
        "othersCount"
    ).textContent =
        others;


    document.getElementById(
        "numberCount"
    ).textContent =
        finalData.length;

}


/* =========================================================
   CSV DOWNLOAD
========================================================= */

function downloadCSV(){

    if(!finalData.length){

        showMessage(
            "Please upload a Zoom TXT file first.",
            true
        );

        return;
    }


    const headers = [

        "S.No",

        "Chat Date",

        "Chat Time",

        "Participant Name",

        "Phone Number",

        "Status",

        "Message"

    ];


    const rows = [headers];


    finalData.forEach(function(item,index){

        rows.push([

            index + 1,

            item.date,

            item.time,

            item.participant,

            item.number,

            item.status,

            item.message

        ]);

    });


    const csv =
        rows
        .map(row =>
            row.map(csvEscape).join(",")
        )
        .join("\r\n");


    /*
       UTF-8 BOM helps Excel display
       Tamil correctly.
    */

    const blob =
        new Blob(
            ["\uFEFF" + csv],
            {
                type:"text/csv;charset=utf-8;"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const link =
        document.createElement("a");


    link.href = url;


    link.download =
        "zoom_chat_extracted.csv";


    document.body.appendChild(link);


    link.click();


    document.body.removeChild(link);


    URL.revokeObjectURL(url);

}


/* =========================================================
   CSV ESCAPE
========================================================= */

function csvEscape(value){

    const text =
        String(value ?? "");


    return '"' +
        text.replace(/"/g,'""') +
        '"';

}


/* =========================================================
   CLEAR DATA
========================================================= */

function clearData(){

    finalData = [];


    document.getElementById(
        "fileInput"
    ).value = "";


    renderTable();


    showMessage(
        "",
        false
    );

}


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(message,isError){

    const box =
        document.getElementById(
            "messageBox"
        );


    if(!message){

        box.style.display = "none";

        box.textContent = "";

        return;

    }


    box.style.display = "block";


    box.textContent = message;


    if(isError){

        box.style.background =
            "#fef2f2";

        box.style.color =
            "#991b1b";

    }else{

        box.style.background =
            "#eff6ff";

        box.style.color =
            "#1e40af";

    }

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   INITIAL
========================================================= */

updateStats();

</script>
