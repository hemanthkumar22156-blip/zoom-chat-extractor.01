<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- TAB BAR LOGO / FAVICON -->
  <link rel="icon" href="./favicon.ico" type="image/x-icon">
  <link rel="shortcut icon" href="./favicon.ico" type="image/x-icon">

  <title>Zoom Chat Extractor</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    .header {
      background: #ffffff;
      padding: 18px 25px;
      display: flex;
      align-items: center;
      gap: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header img {
      width: 45px;
      height: 45px;
      object-fit: contain;
      border-radius: 8px;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
      color: #222;
    }

    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .upload-box {
      background: white;
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
      margin-bottom: 25px;
    }

    .upload-box h2 {
      margin-top: 0;
      margin-bottom: 15px;
      font-size: 20px;
    }

    input[type="file"] {
      width: 100%;
      padding: 12px;
      border: 2px dashed #aaa;
      border-radius: 10px;
      background: #fafafa;
      cursor: pointer;
    }

    .buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    button {
      border: none;
      padding: 11px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
    }

    .btn-download {
      background: #198754;
      color: white;
    }

    .btn-print {
      background: #0d6efd;
      color: white;
    }

    .btn-clear {
      background: #dc3545;
      color: white;
    }

    button:hover {
      opacity: 0.9;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .stat-card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 3px 12px rgba(0,0,0,0.07);
    }

    .stat-card h3 {
      margin: 0 0 8px;
      font-size: 14px;
      color: #666;
    }

    .stat-card p {
      margin: 0;
      font-size: 26px;
      font-weight: bold;
    }

    .table-box {
      background: white;
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 750px;
    }

    th {
      background: #212529;
      color: white;
      padding: 12px;
      text-align: left;
    }

    td {
      padding: 11px;
      border-bottom: 1px solid #eee;
    }

    tr:hover {
      background: #f8f9fa;
    }

    .status {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .status-help {
      background: #fff3cd;
      color: #856404;
    }

    .status-time {
      background: #cff4fc;
      color: #055160;
    }

    .status-others {
      background: #e2e3e5;
      color: #41464b;
    }

    .message {
      margin-top: 12px;
      padding: 12px;
      border-radius: 8px;
      display: none;
    }

    .success {
      background: #d1e7dd;
      color: #0f5132;
    }

    .error {
      background: #f8d7da;
      color: #842029;
    }

    @media (max-width: 800px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 500px) {
      .stats {
        grid-template-columns: 1fr;
      }

      .header h1 {
        font-size: 19px;
      }
    }

    @media print {
      .upload-box,
      .buttons,
      .stats {
        display: none !important;
      }

      body {
        background: white;
      }

      .container {
        margin: 0;
        max-width: 100%;
      }

      .table-box {
        box-shadow: none;
        padding: 0;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <img
      src="./favicon.ico"
      alt="Logo"
      onerror="this.style.display='none'"
    >
    <h1>Zoom Chat Extractor</h1>
  </div>

  <div class="container">

    <div class="upload-box">

      <h2>Upload Zoom Chat TXT File</h2>

      <input
        type="file"
        id="fileInput"
        accept=".txt,text/plain"
      >

      <div class="buttons">

        <button
          class="btn-download"
          onclick="downloadCSV()"
        >
          Download CSV
        </button>

        <button
          class="btn-print"
          onclick="window.print()"
        >
          Print / Save PDF
        </button>

        <button
          class="btn-clear"
          onclick="clearData()"
        >
          Clear
        </button>

      </div>

      <div
        id="message"
        class="message"
      ></div>

    </div>


    <div class="stats">

      <div class="stat-card">
        <h3>Unique Rows</h3>
        <p id="uniqueCount">0</p>
      </div>

      <div class="stat-card">
        <h3>Help</h3>
        <p id="helpCount">0</p>
      </div>

      <div class="stat-card">
        <h3>Time</h3>
        <p id="timeCount">0</p>
      </div>

      <div class="stat-card">
        <h3>Others</h3>
        <p id="othersCount">0</p>
      </div>

      <div class="stat-card">
        <h3>Numbers</h3>
        <p id="numberCount">0</p>
      </div>

    </div>


    <div class="table-box">

      <table id="resultTable">

        <thead>
          <tr>
            <th>S.No</th>
            <th>Chat Time</th>
            <th>Participant Name</th>
            <th>Extracted Number</th>
            <th>Status</th>
          </tr>
        </thead>

        <tbody id="resultBody">
        </tbody>

      </table>

    </div>

  </div>


<script>

let extractedRows = [];


/* =========================
   FILE UPLOAD
========================= */

document
  .getElementById("fileInput")
  .addEventListener("change", function(event) {

    const file = event.target.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = function(e) {

      processFile(e.target.result);

    };

    reader.readAsText(file);

  });



/* =========================
   SHOW MESSAGE
========================= */

function showMessage(text, type) {

  const box = document.getElementById("message");

  box.textContent = text;

  box.className = "message " + type;

  box.style.display = "block";

}



/* =========================
   NORMALIZE PHONE
========================= */

function normalizePhone(phone) {

  let digits = String(phone || "").replace(/\D/g, "");

  if (digits.length === 12 && digits.startsWith("91")) {
    digits = digits.substring(2);
  }

  return digits;

}



/* =========================
   EXTRACT PHONE
========================= */

function extractPhone(text) {

  if (!text) return null;

  let clean = text.replace(/\u00A0/g, " ");

  /* +91 format */
  let match = clean.match(
    /(?:\+91|91)[\s\-]*(\d{5})[\s\-]*(\d{5})/
  );

  if (match) {
    return match[1] + match[2];
  }


  /* Normal 10 digit */
  match = clean.match(
    /(?<!\d)([6-9]\d{9})(?!\d)/
  );

  if (match) {
    return match[1];
  }


  /* Spaces / hyphens */
  match = clean.match(
    /(?<!\d)([6-9]\d{4})[\s\-]+(\d{5})(?!\d)/
  );

  if (match) {
    return match[1] + match[2];
  }


  /* Any digit groups which finally make 10 digits */
  let digits = clean.replace(/\D/g, "");

  if (
    digits.length === 10 &&
    /^[6-9]/.test(digits)
  ) {
    return digits;
  }

  if (
    digits.length === 12 &&
    digits.startsWith("91") &&
    /^[6-9]/.test(digits.substring(2))
  ) {
    return digits.substring(2);
  }

  return null;

}



/* =========================
   STANDALONE HELP
========================= */

function isStandaloneHelp(message) {

  return (
    String(message || "")
      .trim()
      .toLowerCase() === "help"
  );

}



/* =========================
   STANDALONE TIME
========================= */

function isStandaloneTime(message) {

  return (
    String(message || "")
      .trim()
      .toLowerCase() === "time"
  );

}



/* =========================
   NUMBER ONLY MESSAGE
========================= */

function isNumberOnlyMessage(text, number) {

  if (!text || !number) return false;

  let normalizedText = normalizePhone(text);

  return normalizedText === number;

}



/* =========================
   STATUS FROM SAME MESSAGE
========================= */

function classifyStatus(message) {

  const msg = String(message || "")
    .trim()
    .toLowerCase();


  /* Help */
  if (
    /\bhelp\b/i.test(msg)
  ) {
    return "Help";
  }


  /* Time */
  if (
    /\btime\b/i.test(msg) ||
    /\bwhen\b/i.test(msg) ||
    /\bdelay\b/i.test(msg) ||
    /\blate\b/i.test(msg)
  ) {
    return "Time";
  }


  return "Others";

}



/* =========================
   PARSE ZOOM HEADER
========================= */

function parseZoomHeader(line) {

  let participant = "";
  let chatTime = "";


  /* 
     Example:
     17:46:02 From Dr. Prabhakar Raj to Everyone:
  */

  let match = line.match(
    /^(\d{1,2}:\d{2}:\d{2})\s+From\s+(.+?)\s+to\s+.+?:\s*$/i
  );

  if (match) {

    chatTime = match[1];

    participant = match[2].trim();

    return {
      participant,
      chatTime
    };

  }


  /*
     Example:
     [17:46:02] From Name to Everyone:
  */

  match = line.match(
    /^\[?(\d{1,2}:\d{2}:\d{2})\]?\s+From\s+(.+?)\s+to\s+.+?:\s*$/i
  );

  if (match) {

    chatTime = match[1];

    participant = match[2].trim();

    return {
      participant,
      chatTime
    };

  }


  /*
     Example:
     2026-09-20 17:46:02 From Name to Everyone:
  */

  match = line.match(
    /^\d{4}-\d{1,2}-\d{1,2}\s+(\d{1,2}:\d{2}:\d{2})\s+From\s+(.+?)\s+to\s+.+?:\s*$/i
  );

  if (match) {

    chatTime = match[1];

    participant = match[2].trim();

    return {
      participant,
      chatTime
    };

  }


  /*
     Example:
     17:46:02 - From Name to Everyone:
  */

  match = line.match(
    /^(\d{1,2}:\d{2}:\d{2})\s*-\s*From\s+(.+?)\s+to\s+.+?:\s*$/i
  );

  if (match) {

    chatTime = match[1];

    participant = match[2].trim();

    return {
      participant,
      chatTime
    };

  }


  return null;

}



/* =========================
   PROCESS FILE
========================= */

function processFile(text) {

  extractedRows = [];


  const lines = String(text || "")
    .replace(/\r/g, "")
    .split("\n");


  let currentParticipant = "";

  let currentTime = "";

  let currentMessage = "";


  /*
     Pending status is stored PER PARTICIPANT.

     Example:

     Person A
     help

     Person B
     hello

     Person A
     9883726578

     => Person A number = Help
  */

  const pendingStatus = new Map();


  function processCurrentMessage() {

    if (!currentParticipant) return;


    const message = currentMessage
      .trim();


    if (!message) return;


    const number = extractPhone(message);


    /*
       CASE 1:
       Same message contains number

       help 9876543210
       time 9876543210
    */

    if (number) {

      let status = "Others";


      if (
        /\bhelp\b/i.test(message)
      ) {

        status = "Help";

      }
      else if (
        /\btime\b/i.test(message) ||
        /\bwhen\b/i.test(message) ||
        /\bdelay\b/i.test(message) ||
        /\blate\b/i.test(message)
      ) {

        status = "Time";

      }
      else if (
        isNumberOnlyMessage(message, number)
      ) {

        /*
           CASE 2:
           Number only.

           Check pending status
           of SAME participant.
        */

        if (
          pendingStatus.has(currentParticipant)
        ) {

          status =
            pendingStatus.get(currentParticipant);

          pendingStatus.delete(
            currentParticipant
          );

        }

      }


      extractedRows.push({

        time: currentTime,

        name: currentParticipant,

        number: number,

        status: status

      });


      return;

    }


    /*
       Standalone HELP

       Store only for SAME participant.
       Do NOT create a row.
    */

    if (isStandaloneHelp(message)) {

      pendingStatus.set(
        currentParticipant,
        "Help"
      );

      return;

    }


    /*
       Standalone TIME

       Store only for SAME participant.
       Do NOT create a row.
    */

    if (isStandaloneTime(message)) {

      pendingStatus.set(
        currentParticipant,
        "Time"
      );

      return;

    }


    /*
       Any unrelated message from same person
       clears pending Help / Time.
    */

    pendingStatus.delete(
      currentParticipant
    );

  }



  for (let i = 0; i < lines.length; i++) {

    const line = lines[i];


    const header = parseZoomHeader(line);


    if (header) {

      /*
         Finish previous message
      */

      processCurrentMessage();


      /*
         Start new message
      */

      currentParticipant =
        header.participant;

      currentTime =
        header.chatTime;

      currentMessage = "";


      continue;

    }


    /*
       Message body

       Zoom usually places message
       after a TAB.
    */

    if (
      line.trim() !== ""
    ) {

      if (currentMessage) {

        currentMessage += " ";

      }

      currentMessage +=
        line.trim();

    }

  }


  /*
     Process final message
  */

  processCurrentMessage();


  /*
     Remove duplicate numbers.

     Priority:
       Help = 1
       Time = 2
       Others = 3
  */

  const priority = {
    Help: 1,
    Time: 2,
    Others: 3
  };


  const uniqueMap = new Map();


  extractedRows.forEach(row => {

    const key = row.number;


    if (!uniqueMap.has(key)) {

      uniqueMap.set(
        key,
        row
      );

    }
    else {

      const existing =
        uniqueMap.get(key);


      if (
        priority[row.status] <
        priority[existing.status]
      ) {

        uniqueMap.set(
          key,
          row
        );

      }

    }

  });


  extractedRows =     Array.from(uniqueMap.values());  /* TIME ASCENDING ORDER */ extractedRows.sort((a, b) => {    const timeA = a.time.split(":").map(Number);   const timeB = b.time.split(":").map(Number);    const secondsA =     timeA[0] * 3600 +     timeA[1] * 60 +     timeA[2];    const secondsB =     timeB[0] * 3600 +     timeB[1] * 60 +     timeB[2];    return secondsA - secondsB; });   renderTable();

  updateStats();


  if (extractedRows.length > 0) {

    showMessage(
      "File processed successfully. " +
      extractedRows.length +
      " unique phone number(s) found.",
      "success"
    );

  }
  else {

    showMessage(
      "File uploaded, but no 10-digit phone number was found. Please check the Zoom TXT format.",
      "error"
    );

  }

}



/* =========================
   RENDER TABLE
========================= */

function renderTable() {

  const body =
    document.getElementById("resultBody");


  body.innerHTML = "";


  extractedRows.forEach(
    (row, index) => {

      const tr =
        document.createElement("tr");


      let statusClass =
        "status-others";


      if (row.status === "Help") {

        statusClass =
          "status-help";

      }
      else if (row.status === "Time") {

        statusClass =
          "status-time";

      }


      tr.innerHTML = `

        <td>${index + 1}</td>

        <td>${escapeHtml(row.time)}</td>

        <td>${escapeHtml(row.name)}</td>

        <td>${escapeHtml(row.number)}</td>

        <td>
          <span class="status ${statusClass}">
            ${escapeHtml(row.status)}
          </span>
        </td>

      `;


      body.appendChild(tr);

    }
  );

}



/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value) {

  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}



/* =========================
   UPDATE STATS
========================= */

function updateStats() {

  const help =
    extractedRows.filter(
      r => r.status === "Help"
    ).length;


  const time =
    extractedRows.filter(
      r => r.status === "Time"
    ).length;


  const others =
    extractedRows.filter(
      r => r.status === "Others"
    ).length;


  document.getElementById(
    "uniqueCount"
  ).textContent =
    extractedRows.length;


  document.getElementById(
    "helpCount"
  ).textContent =
    help;


  document.getElementById(
    "timeCount"
  ).textContent =
    time;


  document.getElementById(
    "othersCount"
  ).textContent =
    others;


  document.getElementById(
    "numberCount"
  ).textContent =
    extractedRows.length;

}



/* =========================
   DOWNLOAD CSV
========================= */

function downloadCSV() {

  if (extractedRows.length === 0) {

    alert(
      "No data available to download."
    );

    return;

  }


  let csv =
    "S.No,Chat Time,Participant Name,Extracted Number,Status\n";


  extractedRows.forEach(
    (row, index) => {

      csv +=
        `${index + 1},` +
        `"${escapeCSV(row.time)}",` +
        `"${escapeCSV(row.name)}",` +
        `"${escapeCSV(row.number)}",` +
        `"${escapeCSV(row.status)}"\n`;

    }
  );


  const blob =
    new Blob(
      ["\uFEFF" + csv],
      {
        type: "text/csv;charset=utf-8;"
      }
    );


  const url =
    URL.createObjectURL(blob);


  const a =
    document.createElement("a");


  a.href = url;

  a.download =
    "zoom_chat_extracted.csv";


  document.body.appendChild(a);

  a.click();

  document.body.removeChild(a);


  URL.revokeObjectURL(url);

}



/* =========================
   ESCAPE CSV
========================= */

function escapeCSV(value) {

  return String(value || "")
    .replace(/"/g, '""');

}



/* =========================
   CLEAR
========================= */

function clearData() {

  extractedRows = [];


  document.getElementById(
    "resultBody"
  ).innerHTML = "";


  document.getElementById(
    "fileInput"
  ).value = "";


  document.getElementById(
    "uniqueCount"
  ).textContent = "0";


  document.getElementById(
    "helpCount"
  ).textContent = "0";


  document.getElementById(
    "timeCount"
  ).textContent = "0";


  document.getElementById(
    "othersCount"
  ).textContent = "0";


  document.getElementById(
    "numberCount"
  ).textContent = "0";


  document.getElementById(
    "message"
  ).style.display = "none";

}

</script>

</body>
</html>
