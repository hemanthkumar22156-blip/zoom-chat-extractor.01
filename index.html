<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Zoom Chat Extractor</title>

  <!-- TAB BAR FAVICON -->
  <link rel="icon" href="/zoom-chat-extractor.01/favicon.ico?v=2" type="image/x-icon">
  <link rel="shortcut icon" href="/zoom-chat-extractor.01/favicon.ico?v=2" type="image/x-icon">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }

    .container {
      max-width: 1250px;
      margin: 0 auto;
      padding: 25px;
    }

    header {
      background: white;
      border-radius: 16px;
      padding: 20px 24px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }

   header img {
  width: 58px;
  height: 58px;
  object-fit: contain;
  border-radius: 12px;
}

    header h1 {
      margin: 0;
      font-size: 26px;
      color: #111827;
    }

    header p {
      margin: 5px 0 0;
      color: #6b7280;
      font-size: 14px;
    }

    .upload-box {
      background: white;
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }

    .upload-box label {
      display: block;
      font-weight: bold;
      margin-bottom: 10px;
    }

    input[type="file"] {
      width: 100%;
      padding: 12px;
      border: 2px dashed #cbd5e1;
      border-radius: 10px;
      background: #f8fafc;
      cursor: pointer;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 15px;
    }

    button {
      border: none;
      border-radius: 9px;
      padding: 11px 18px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-primary {
      background: #2563eb;
      color: white;
    }

    .btn-secondary {
      background: #111827;
      color: white;
    }

    button:hover {
      opacity: 0.9;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat {
      background: white;
      border-radius: 14px;
      padding: 18px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }

    .stat .number {
      font-size: 26px;
      font-weight: bold;
      color: #111827;
    }

    .stat .label {
      margin-top: 5px;
      font-size: 13px;
      color: #6b7280;
    }

    .table-box {
      background: white;
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 750px;
    }

    th {
      background: #111827;
      color: white;
      padding: 13px 10px;
      text-align: left;
      font-size: 14px;
    }

    td {
      padding: 12px 10px;
      border-bottom: 1px solid #e5e7eb;
      font-size: 14px;
    }

    tr:hover td {
      background: #f8fafc;
    }

    .status {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .status-help {
      background: #fee2e2;
      color: #b91c1c;
    }

    .status-time {
      background: #fef3c7;
      color: #92400e;
    }

    .status-others {
      background: #e5e7eb;
      color: #374151;
    }

    .empty {
      text-align: center;
      padding: 35px;
      color: #6b7280;
    }

    @media (max-width: 800px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      header h1 {
        font-size: 21px;
      }
    }

    @media (max-width: 500px) {
      .container {
        padding: 12px;
      }

      .stats {
        grid-template-columns: 1fr 1fr;
      }

      header {
        padding: 15px;
      }
    }

    @media print {
      body {
        background: white;
      }

      .upload-box,
      .buttons {
        display: none !important;
      }

      .container {
        max-width: 100%;
        padding: 0;
      }

      header {
        box-shadow: none;
        margin-bottom: 10px;
      }

      .stats {
        box-shadow: none;
      }

      .table-box {
        box-shadow: none;
      }

      table {
        min-width: 100%;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <header>
    <img src="./favicon.ico?v=3" alt="Zoom Chat Extractor">
    <div>
      <h1>Zoom Chat Extractor</h1>
      <p>Upload Zoom chat TXT file and extract unique phone numbers</p>
    </div>
  </header>

  <div class="upload-box">

    <label for="fileInput">Select Zoom Chat TXT File</label>

    <input
      type="file"
      id="fileInput"
      accept=".txt"
    >

    <div class="buttons">
      <button class="btn-primary" onclick="downloadCSV()">
        Download CSV
      </button>

      <button class="btn-secondary" onclick="window.print()">
        Print / Save PDF
      </button>
    </div>

  </div>

  <div class="stats">

    <div class="stat">
      <div class="number" id="uniqueCount">0</div>
      <div class="label">Unique Rows</div>
    </div>

    <div class="stat">
      <div class="number" id="helpCount">0</div>
      <div class="label">Help</div>
    </div>

    <div class="stat">
      <div class="number" id="timeCount">0</div>
      <div class="label">Time</div>
    </div>

    <div class="stat">
      <div class="number" id="othersCount">0</div>
      <div class="label">Others</div>
    </div>

    <div class="stat">
      <div class="number" id="numberCount">0</div>
      <div class="label">Numbers</div>
    </div>

  </div>

  <div class="table-box">

    <table>

      <thead>
        <tr>
          <th>S.No</th>
          <th>Chat Time</th>
          <th>Participant Name</th>
          <th>Extracted Number</th>
          <th>Status</th>
        </tr>
      </thead>

      <tbody id="tableBody">
        <tr>
          <td colspan="5" class="empty">
            Upload a Zoom chat TXT file to see the results
          </td>
        </tr>
      </tbody>

    </table>

  </div>

</div>

<script>

let records = [];


/* =========================
   TIME WORDS
========================= */

const timeWords =
  /\b(time|when|what time|timing|clock|hour|hours|minute|minutes|class start|start time|start|schedule|நேரம்|மணி)\b/i;


/* =========================
   STATUS PRIORITY
========================= */

function statusPriority(status) {

  if (status === "Help") {
    return 1;
  }

  if (status === "Time") {
    return 2;
  }

  return 3;
}


/* =========================
   TIME TO SECONDS
========================= */

function timeToSeconds(time) {

  const parts = String(time).split(":").map(Number);

  if (parts.length === 2) {
    return parts[0] * 3600 +
           parts[1] * 60;
  }

  if (parts.length === 3) {
    return parts[0] * 3600 +
           parts[1] * 60 +
           parts[2];
  }

  return 0;
}


/* =========================
   EXTRACT PHONE NUMBER
========================= */

function getNumber(message) {

  const text = String(message || "");

  const candidates =
    text.match(/\d[\d\s-]*\d|\d+/g) || [];

  for (const candidate of candidates) {

    const digits =
      candidate.replace(/\D/g, "");

    if (digits.length === 10) {
      return digits;
    }
  }

  const allDigits =
    text.replace(/\D/g, "");

  if (allDigits.length === 10) {
    return allDigits;
  }

  return "";
}


/* =========================
   GET STATUS
========================= */

function getStatus(message) {

  const text = String(message || "");

  if (/\bhelp\b/i.test(text)) {
    return "Help";
  }

  if (timeWords.test(text)) {
    return "Time";
  }

  return "Others";
}


/* =========================
   MAKE RECORD
========================= */

function makeRecord(time, name, message) {

  const number = getNumber(message);

  // Only records having phone number
  if (!number) {
    return null;
  }

  return {
    time: time,
    name: name.trim(),
    number: number,
    status: getStatus(message)
  };
}


/* =========================
   PARSE ZOOM CHAT
========================= */

function parseChat(text) {

  const lines =
    text.replace(/\r/g, "").split("\n");

  const data = [];

  const headerPattern =
    /^(?:\[)?(\d{1,2}:\d{2}(?::\d{2})?)(?:\])?\s*(?:[-–—]\s*)?From\s+(.+?)\s+to\s+[^:]+:\s*(.*)$/i;

  let current = null;

  for (let i = 0; i < lines.length; i++) {

    const line = lines[i];

    const match = line.match(headerPattern);

    if (match) {

      if (current) {

        const record = makeRecord(
          current.time,
          current.name,
          current.message
        );

        if (record) {
          data.push(record);
        }
      }

      current = {
        time: match[1],
        name: match[2],
        message: match[3] || ""
      };

    } else if (current) {

      if (line.trim() !== "") {

        current.message +=
          " " + line.trim();
      }
    }
  }


  if (current) {

    const record = makeRecord(
      current.time,
      current.name,
      current.message
    );

    if (record) {
      data.push(record);
    }
  }

  return data;
}


/* =========================
   REMOVE DUPLICATES
========================= */

function removeDuplicates(data) {

  const map = new Map();

  for (const item of data) {

    const existing =
      map.get(item.number);

    if (!existing) {

      map.set(item.number, item);

      continue;
    }


    const newPriority =
      statusPriority(item.status);

    const oldPriority =
      statusPriority(existing.status);


    // Better status priority wins
    if (newPriority < oldPriority) {

      map.set(item.number, item);

    }

    // Same priority -> latest time wins
    else if (newPriority === oldPriority) {

      if (
        timeToSeconds(item.time) >
        timeToSeconds(existing.time)
      ) {

        map.set(item.number, item);
      }
    }
  }

  return Array.from(map.values());
}


/* =========================
   SORT BY ACTUAL CHAT TIME
========================= */

function sortByChatTime(data) {

  return data.sort(function(a, b) {

    return (
      timeToSeconds(a.time) -
      timeToSeconds(b.time)
    );

  });
}


/* =========================
   RENDER TABLE
========================= */

function render() {

  const tbody =
    document.getElementById("tableBody");

  tbody.innerHTML = "";


  if (records.length === 0) {

    tbody.innerHTML = `
      <tr>
        <td colspan="5" class="empty">
          No phone numbers found
        </td>
      </tr>
    `;

    updateStats();

    return;
  }


  records.forEach(function(item, index) {

    const row =
      document.createElement("tr");


    let statusClass =
      "status-others";

    if (item.status === "Help") {
      statusClass = "status-help";
    }

    else if (item.status === "Time") {
      statusClass = "status-time";
    }


    row.innerHTML = `
      <td>${index + 1}</td>

      <td>${escapeHtml(item.time)}</td>

      <td>${escapeHtml(item.name)}</td>

      <td>${escapeHtml(item.number)}</td>

      <td>
        <span class="status ${statusClass}">
          ${escapeHtml(item.status)}
        </span>
      </td>
    `;


    tbody.appendChild(row);

  });


  updateStats();
}


/* =========================
   UPDATE STATS
========================= */

function updateStats() {

  const help =
    records.filter(
      item => item.status === "Help"
    ).length;

  const time =
    records.filter(
      item => item.status === "Time"
    ).length;

  const others =
    records.filter(
      item => item.status === "Others"
    ).length;


  document.getElementById("uniqueCount")
    .textContent = records.length;

  document.getElementById("helpCount")
    .textContent = help;

  document.getElementById("timeCount")
    .textContent = time;

  document.getElementById("othersCount")
    .textContent = others;

  document.getElementById("numberCount")
    .textContent = records.length;
}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* =========================
   FILE UPLOAD
========================= */

document
  .getElementById("fileInput")
  .addEventListener("change", function(event) {

    const file =
      event.target.files[0];

    if (!file) {
      return;
    }


    const reader =
      new FileReader();


    reader.onload = function(e) {

      const text = e.target.result;


      const parsed =
        parseChat(text);


      records =
        removeDuplicates(parsed);


      // IMPORTANT:
      // Sort selected duplicate record
      // using its actual Chat Time
      records =
        sortByChatTime(records);


      render();
    };


    reader.readAsText(file);

  });


/* =========================
   DOWNLOAD CSV
========================= */

function downloadCSV() {

  if (records.length === 0) {

    alert("Please upload a Zoom chat TXT file first.");

    return;
  }


  let csv =
    "S.No,Chat Time,Participant Name,Extracted Number,Status\n";


  records.forEach(function(item, index) {

    csv +=
      [
        index + 1,
        csvEscape(item.time),
        csvEscape(item.name),
        csvEscape(item.number),
        csvEscape(item.status)
      ].join(",") + "\n";

  });


  const blob =
    new Blob(
      [csv],
      {
        type: "text/csv;charset=utf-8;"
      }
    );


  const url =
    URL.createObjectURL(blob);


  const a =
    document.createElement("a");


  a.href = url;

  a.download =
    "zoom_chat_extracted.csv";


  document.body.appendChild(a);

  a.click();

  document.body.removeChild(a);


  URL.revokeObjectURL(url);
}


/* =========================
   CSV ESCAPE
========================= */

function csvEscape(value) {

  const text =
    String(value ?? "");

  if (
    text.includes(",") ||
    text.includes('"') ||
    text.includes("\n")
  ) {

    return '"' +
      text.replace(/"/g, '""') +
      '"';
  }

  return text;
}

</script>

</body>
</html>
