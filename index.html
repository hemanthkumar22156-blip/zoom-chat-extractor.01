<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zoom Chat Extractor</title>

<link rel="icon" href="/zoom-chat-extractor.01/favicon.ico?v=10" type="image/x-icon">
<link rel="shortcut icon" href="/zoom-chat-extractor.01/favicon.ico?v=10" type="image/x-icon">

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f4f7fb;
    color:#222;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:25px;
}

.header{
    background:white;
    padding:20px;
    border-radius:14px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
    margin-bottom:20px;
    display:flex;
    align-items:center;
    gap:15px;
}

.header img{
    width:55px;
    height:55px;
    object-fit:contain;
}

.header h1{
    margin:0;
    font-size:28px;
}

.upload-box{
    background:white;
    padding:25px;
    border-radius:14px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
    margin-bottom:20px;
}

input[type=file]{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
}

button{
    margin-top:15px;
    padding:11px 18px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    margin-right:8px;
}

#extractBtn{
    background:#2563eb;
    color:white;
}

#downloadBtn{
    background:#16a34a;
    color:white;
}

#printBtn{
    background:#555;
    color:white;
}

.stats{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.stat{
    background:white;
    padding:15px 20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
    min-width:130px;
}

.stat b{
    display:block;
    font-size:22px;
    margin-top:5px;
}

.table-box{
    background:white;
    padding:20px;
    border-radius:14px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:12px;
    border-bottom:1px solid #ddd;
    text-align:left;
    white-space:nowrap;
}

th{
    background:#f1f5f9;
}

.status-help{
    font-weight:bold;
    color:#dc2626;
}

.status-time{
    font-weight:bold;
    color:#2563eb;
}

.status-others{
    color:#555;
}

#message{
    margin-top:15px;
    font-weight:bold;
}

@media(max-width:700px){
    .container{
        padding:12px;
    }

    .header h1{
        font-size:22px;
    }

    .header img{
        width:45px;
        height:45px;
    }
}

@media print{
    .upload-box,
    .stats button{
        display:none;
    }

    body{
        background:white;
    }

    .container{
        max-width:none;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <img src="/zoom-chat-extractor.01/favicon.ico?v=10"
             alt="Zoom Chat Extractor">
        <h1>Zoom Chat Extractor</h1>
    </div>

    <div class="upload-box">

        <input type="file" id="fileInput" accept=".txt,text/plain">

        <br>

        <button id="extractBtn">Extract Chat</button>
        <button id="downloadBtn">Download CSV</button>
        <button id="printBtn">Print / Save PDF</button>

        <div id="message"></div>

    </div>

    <div class="stats">

        <div class="stat">
            Unique Rows
            <b id="uniqueCount">0</b>
        </div>

        <div class="stat">
            Help
            <b id="helpCount">0</b>
        </div>

        <div class="stat">
            Time
            <b id="timeCount">0</b>
        </div>

        <div class="stat">
            Others
            <b id="othersCount">0</b>
        </div>

        <div class="stat">
            Numbers
            <b id="numberCount">0</b>
        </div>

    </div>

    <div class="table-box">

        <table id="resultTable">

            <thead>
                <tr>
                    <th>S.No</th>
                    <th>Chat Time</th>
                    <th>Participant Name</th>
                    <th>Extracted Number</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody id="resultBody">
            </tbody>

        </table>

    </div>

</div>


<script>

let finalResults = [];


/* =========================================
   STATUS PRIORITY
   Help = 3
   Time = 2
   Others = 1
========================================= */

function getPriority(status){

    if(status === "Help") return 3;
    if(status === "Time") return 2;

    return 1;
}


/* =========================================
   CONVERT TIME TO SECONDS
========================================= */

function timeToSeconds(time){

    if(!time) return 0;

    const parts = time.split(":").map(Number);

    if(parts.length === 2){
        return parts[0] * 3600 + parts[1] * 60;
    }

    return parts[0] * 3600 +
           parts[1] * 60 +
           parts[2];
}


/* =========================================
   PARSE ZOOM CHAT HEADER
========================================= */

function parseChatHeader(line){

    const pattern =
        /^\s*\[?\s*(\d{1,2}:\d{2}(?::\d{2})?)\s*\]?\s*(?:[-–—]\s*)?From\s+(.+?)(?:\s+to\s+[^:]+)?\s*:\s*(.*)$/i;

    const match = line.match(pattern);

    if(!match) return null;

    return {
        time: match[1],
        name: match[2].trim(),
        message: match[3].trim()
    };
}


/* =========================================
   EXTRACT 10 DIGIT PHONE NUMBER
========================================= */

function extractPhoneNumber(text){

    if(!text) return null;

    /*
       Supports:

       9876543210
       987 654 3210
       987-654-3210
       9876 543 210
       9876-543-210
    */

    const match = text.match(
        /(?:^|\D)(\d[\d\s-]{8,12}\d)(?!\d)/
    );

    if(!match) return null;

    const number = match[1].replace(/\D/g,"");

    if(number.length !== 10) return null;

    return number;
}


/* =========================================
   STATUS DETECTION
========================================= */

function detectStatus(text){

    if(!text) return "Others";

    const value = text.trim().toLowerCase();

    /* HELP */

    if(
        /\bhelp\b/i.test(value) ||
        /\bneed help\b/i.test(value) ||
        /help me/i.test(value)
    ){
        return "Help";
    }


    /* TIME */

    const timeWords =
        /\b(time|timing|when|schedule|hour|hours|minute|minutes|start\s*time|morning|evening|night)\b/i;

    const tamilTimeWords =
        /(நேரம்|மணி)/i;

    if(
        timeWords.test(value) ||
        tamilTimeWords.test(value)
    ){
        return "Time";
    }


    return "Others";
}


/* =========================================
   CHECK WHETHER MESSAGE IS A STATUS MESSAGE
========================================= */

function isStatusMessage(text){

    if(!text) return false;

    const value = text.trim();

    /*
       Pure / short status messages.

       Help
       help
       Need help
       Time?
       Timing?
       When?
    */

    if(
        /^help[\s!?.,]*$/i.test(value) ||
        /^need\s+help[\s!?.,]*$/i.test(value) ||
        /^help\s+me[\s!?.,]*$/i.test(value)
    ){
        return "Help";
    }


    if(
        /^(time|timing|when|schedule|hours?|minutes?|morning|evening|night)[\s!?.,]*$/i.test(value) ||
        /^(நேரம்|மணி)[\s!?.,]*$/i.test(value)
    ){
        return "Time";
    }


    return null;
}


/* =========================================
   MAIN PARSER
========================================= */

function parseZoomChat(text){

    const lines = text.split(/\r?\n/);

    const messages = [];

    let current = null;


    for(let i = 0; i < lines.length; i++){

        const line = lines[i];

        const header = parseChatHeader(line);


        if(header){

            if(current){

                messages.push(current);

            }

            current = {
                time: header.time,
                name: header.name,
                message: header.message || ""
            };

        }else{

            if(current){

                const extra = line.trim();

                if(extra){

                    if(current.message){

                        current.message += " " + extra;

                    }else{

                        current.message = extra;

                    }

                }

            }

        }

    }


    if(current){

        messages.push(current);

    }


    return messages;
}


/* =========================================
   BUILD CUSTOMER RECORDS

   IMPORTANT:

   Number first -> Help later = Help

   Help first -> Number later = Help

   Number first -> Time later = Time

   Time first -> Number later = Time

   Help always beats Time
========================================= */

function buildCustomerRecords(messages){

    /*
       Temporary records.

       We keep status messages separately because
       status may come BEFORE the number.
    */

    const pendingByName = new Map();

    const records = [];


    for(let i = 0; i < messages.length; i++){

        const msg = messages[i];

        const phone = extractPhoneNumber(msg.message);

        const detectedStatus = detectStatus(msg.message);

        const pureStatus = isStatusMessage(msg.message);


        /* =====================================
           CASE 1:
           MESSAGE HAS PHONE NUMBER
        ===================================== */

        if(phone){

            const key = msg.name.trim().toLowerCase();


            /*
               Check whether customer already has
               a previous Help / Time message.
            */

            let record = records.find(
                r =>
                    r.name.trim().toLowerCase() === key &&
                    r.number === phone
            );


            if(!record){

                record = {
                    name: msg.name,
                    number: phone,
                    status: "Others",
                    time: msg.time,
                    timeSeconds: timeToSeconds(msg.time),
                    index: i
                };

                records.push(record);

            }


            /*
               If current message itself contains
               Help / Time, apply it.
            */

            if(detectedStatus === "Help"){

                record.status = "Help";
                record.time = msg.time;
                record.timeSeconds = timeToSeconds(msg.time);
                record.index = i;

            }
            else if(
                detectedStatus === "Time" &&
                getPriority(record.status) < getPriority("Time")
            ){

                record.status = "Time";
                record.time = msg.time;
                record.timeSeconds = timeToSeconds(msg.time);
                record.index = i;

            }


            /*
               If Help / Time came BEFORE number,
               apply pending status.
            */

            const pending = pendingByName.get(key);

            if(pending){

                if(
                    getPriority(pending.status) >
                    getPriority(record.status)
                ){

                    record.status = pending.status;
                    record.time = pending.time;
                    record.timeSeconds =
                        timeToSeconds(pending.time);
                    record.index = pending.index;

                }
                else if(
                    getPriority(pending.status) ===
                    getPriority(record.status)
                ){

                    /*
                       Same priority:
                       latest status message wins.
                    */

                    if(
                        pending.timeSeconds >
                        record.timeSeconds
                    ){

                        record.time = pending.time;
                        record.timeSeconds =
                            pending.timeSeconds;
                        record.index = pending.index;

                    }

                }

            }

            continue;
        }


        /* =====================================
           CASE 2:
           NO NUMBER
           BUT MESSAGE IS HELP / TIME
        ===================================== */

        if(pureStatus){

            const key = msg.name.trim().toLowerCase();

            const status = pureStatus;

            const statusRecord = {
                status: status,
                time: msg.time,
                timeSeconds: timeToSeconds(msg.time),
                index: i
            };


            /*
               Save status so that if number comes
               later, it can be connected.
            */

            const oldPending = pendingByName.get(key);


            if(!oldPending){

                pendingByName.set(key, statusRecord);

            }
            else if(
                getPriority(status) >
                getPriority(oldPending.status)
            ){

                pendingByName.set(key, statusRecord);

            }
            else if(
                getPriority(status) ===
                getPriority(oldPending.status)
            ){

                if(
                    statusRecord.timeSeconds >
                    oldPending.timeSeconds
                ){

                    pendingByName.set(key, statusRecord);

                }

            }


            /*
               Also check if this customer already
               has a number record.

               This handles:

               NUMBER
               HELP
            */

            const existingRecords = records.filter(
                r =>
                    r.name.trim().toLowerCase() === key
            );


            for(const record of existingRecords){

                const currentPriority =
                    getPriority(record.status);

                const newPriority =
                    getPriority(status);


                /*
                   Higher priority always wins.
                */

                if(newPriority > currentPriority){

                    record.status = status;
                    record.time = msg.time;
                    record.timeSeconds =
                        timeToSeconds(msg.time);
                    record.index = i;

                }
                else if(newPriority === currentPriority){

                    /*
                       Same priority:
                       latest message wins.
                    */

                    if(
                        statusRecord.timeSeconds >
                        record.timeSeconds
                    ){

                        record.status = status;
                        record.time = msg.time;
                        record.timeSeconds =
                            statusRecord.timeSeconds;
                        record.index = i;

                    }

                }

            }

        }

    }


    return records;
}


/* =========================================
   REMOVE DUPLICATE NUMBERS

   FINAL PRIORITY:

   Help > Time > Others

   Same priority:
   latest status time wins
========================================= */

function removeDuplicates(records){

    const map = new Map();


    for(const record of records){

        const existing = map.get(record.number);


        if(!existing){

            map.set(record.number, record);
            continue;

        }


        const newPriority =
            getPriority(record.status);

        const oldPriority =
            getPriority(existing.status);


        if(newPriority > oldPriority){

            map.set(record.number, record);

        }
        else if(newPriority === oldPriority){

            if(
                record.timeSeconds >
                existing.timeSeconds
            ){

                map.set(record.number, record);

            }

        }

    }


    return Array.from(map.values());
}


/* =========================================
   SORT BY FINAL CHAT TIME
========================================= */

function sortByChatTime(records){

    return records.sort(
        (a,b) =>
            a.timeSeconds - b.timeSeconds
    );

}


/* =========================================
   RENDER TABLE
========================================= */

function renderTable(records){

    const body =
        document.getElementById("resultBody");

    body.innerHTML = "";


    records.forEach((record,index)=>{

        const row =
            document.createElement("tr");


        let statusClass = "status-others";

        if(record.status === "Help"){
            statusClass = "status-help";
        }
        else if(record.status === "Time"){
            statusClass = "status-time";
        }


        row.innerHTML = `
            <td>${index + 1}</td>
            <td>${escapeHtml(record.time)}</td>
            <td>${escapeHtml(record.name)}</td>
            <td>${escapeHtml(record.number)}</td>
            <td class="${statusClass}">
                ${escapeHtml(record.status)}
            </td>
        `;


        body.appendChild(row);

    });


    updateStats(records);

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =========================================
   UPDATE STATS
========================================= */

function updateStats(records){

    document.getElementById("uniqueCount").textContent =
        records.length;


    document.getElementById("helpCount").textContent =
        records.filter(r => r.status === "Help").length;


    document.getElementById("timeCount").textContent =
        records.filter(r => r.status === "Time").length;


    document.getElementById("othersCount").textContent =
        records.filter(r => r.status === "Others").length;


    document.getElementById("numberCount").textContent =
        new Set(records.map(r => r.number)).size;

}


/* =========================================
   EXTRACT BUTTON
========================================= */

document
.getElementById("extractBtn")
.addEventListener("click",()=>{

    const file =
        document.getElementById("fileInput").files[0];


    const message =
        document.getElementById("message");


    if(!file){

        message.textContent =
            "Please select a Zoom TXT file.";

        return;
    }


    const reader = new FileReader();


    reader.onload = function(e){

        try{

            const text = e.target.result;


            const messages =
                parseZoomChat(text);


            if(messages.length === 0){

                finalResults = [];

                renderTable([]);

                message.textContent =
                    "No Zoom chat messages found. Please check the TXT format.";

                return;
            }


            const records =
                buildCustomerRecords(messages);


            const uniqueRecords =
                removeDuplicates(records);


            finalResults =
                sortByChatTime(uniqueRecords);


            renderTable(finalResults);


            if(finalResults.length === 0){

                message.textContent =
                    "File uploaded, but no 10-digit phone number was found.";

            }
            else{

                message.textContent =
                    `Successfully extracted ${finalResults.length} unique number(s).`;

            }

        }
        catch(error){

            console.error(error);

            message.textContent =
                "Error reading the file. Please check the Zoom TXT format.";

        }

    };


    reader.readAsText(file);

});


/* =========================================
   DOWNLOAD CSV
========================================= */

document
.getElementById("downloadBtn")
.addEventListener("click",()=>{

    if(finalResults.length === 0){

        alert("Please extract the chat first.");

        return;
    }


    let csv =
        "S.No,Chat Time,Participant Name,Extracted Number,Status\n";


    finalResults.forEach((record,index)=>{

        csv +=
            `${index + 1},` +
            `"${record.time.replace(/"/g,'""')}",` +
            `"${record.name.replace(/"/g,'""')}",` +
            `"${record.number}",` +
            `"${record.status}"\n`;

    });


    const blob =
        new Blob([csv],{
            type:"text/csv;charset=utf-8;"
        });


    const url =
        URL.createObjectURL(blob);


    const a =
        document.createElement("a");

    a.href = url;
    a.download = "zoom_chat_extracted.csv";

    document.body.appendChild(a);

    a.click();

    document.body.removeChild(a);

    URL.revokeObjectURL(url);

});


/* =========================================
   PRINT / PDF
========================================= */

document
.getElementById("printBtn")
.addEventListener("click",()=>{

    if(finalResults.length === 0){

        alert("Please extract the chat first.");

        return;
    }

    window.print();

});

</script>

</body>
</html>
