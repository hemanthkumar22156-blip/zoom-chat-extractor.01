<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Zoom Chat Extractor</title>

  <!-- FAVICON -->
  <link rel="icon" href="/zoom-chat-extractor.01/favicon.ico?v=10" type="image/x-icon">
  <link rel="shortcut icon" href="/zoom-chat-extractor.01/favicon.ico?v=10" type="image/x-icon">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f7fb;
      color: #111827;
    }

    .container {
      max-width: 1250px;
      margin: auto;
      padding: 25px;
    }

    /* HEADER */

    header {
      background: white;
      border-radius: 18px;
      padding: 20px 25px;
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 22px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.06);
    }

    header img {
      width: 70px;
      height: 70px;
      object-fit: contain;
      border-radius: 14px;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 6px 0 0;
      color: #64748b;
    }

    /* CARD */

    .card {
      background: white;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.06);
    }

    .file-label {
      display: block;
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    input[type="file"] {
      width: 100%;
      padding: 12px;
      border: 2px dashed #cbd5e1;
      border-radius: 12px;
      background: #f8fafc;
      cursor: pointer;
    }

    /* BUTTONS */

    .buttons {
      display: flex;
      gap: 12px;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .download {
      background: #2563eb;
      color: white;
    }

    .print {
      background: #111827;
      color: white;
    }

    button:hover {
      opacity: 0.9;
    }

    /* MESSAGE */

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      font-weight: bold;
    }

    .success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    /* STATS */

    .stats {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 14px;
      margin-bottom: 20px;
    }

    .stat {
      background: white;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 18px rgba(0,0,0,0.05);
    }

    .stat-number {
      font-size: 28px;
      font-weight: bold;
    }

    .stat-label {
      color: #64748b;
      margin-top: 5px;
    }

    /* TABLE */

    .table-card {
      background: white;
      border-radius: 18px;
      padding: 18px;
      overflow-x: auto;
      box-shadow: 0 4px 18px rgba(0,0,0,0.06);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 800px;
    }

    th {
      background: #111827;
      color: white;
      padding: 14px;
      text-align: left;
    }

    td {
      padding: 13px;
      border-bottom: 1px solid #e5e7eb;
    }

    tr:hover td {
      background: #f8fafc;
    }

    /* STATUS */

    .status {
      display: inline-block;
      padding: 5px 11px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .help {
      background: #fee2e2;
      color: #b91c1c;
    }

    .time {
      background: #fef3c7;
      color: #92400e;
    }

    .others {
      background: #e5e7eb;
      color: #374151;
    }

    .empty {
      text-align: center;
      padding: 35px;
      color: #64748b;
    }

    /* MOBILE */

    @media (max-width: 850px) {

      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

    }

    @media (max-width: 550px) {

      .container {
        padding: 12px;
      }

      header {
        padding: 15px;
      }

      header img {
        width: 55px;
        height: 55px;
      }

      header h1 {
        font-size: 21px;
      }

      .stats {
        grid-template-columns: 1fr 1fr;
      }

    }

    /* PRINT */

    @media print {

      body {
        background: white;
      }

      .upload-card,
      .buttons,
      .message {
        display: none !important;
      }

      .container {
        max-width: 100%;
        padding: 0;
      }

      header,
      .card,
      .table-card,
      .stat {
        box-shadow: none;
      }

    }
  </style>
</head>

<body>

<div class="container">

  <!-- HEADER -->

  <header>

    <img
      src="/zoom-chat-extractor.01/favicon.ico?v=10"
      alt="Zoom Chat Extractor"
    >

    <div>

      <h1>Zoom Chat Extractor</h1>

      <p>
        Upload Zoom chat TXT file and extract unique phone numbers
      </p>

    </div>

  </header>


  <!-- UPLOAD -->

  <div class="card upload-card">

    <label class="file-label">
      Select Zoom Chat TXT File
    </label>

    <input
      type="file"
      id="fileInput"
      accept=".txt,text/plain"
    >

    <div class="buttons">

      <button
        class="download"
        onclick="downloadCSV()"
      >
        Download CSV
      </button>

      <button
        class="print"
        onclick="window.print()"
      >
        Print / Save PDF
      </button>

    </div>

    <div id="messageBox" class="message"></div>

  </div>


  <!-- STATS -->

  <div class="stats">

    <div class="stat">
      <div class="stat-number" id="uniqueCount">0</div>
      <div class="stat-label">Unique Rows</div>
    </div>

    <div class="stat">
      <div class="stat-number" id="helpCount">0</div>
      <div class="stat-label">Help</div>
    </div>

    <div class="stat">
      <div class="stat-number" id="timeCount">0</div>
      <div class="stat-label">Time</div>
    </div>

    <div class="stat">
      <div class="stat-number" id="othersCount">0</div>
      <div class="stat-label">Others</div>
    </div>

    <div class="stat">
      <div class="stat-number" id="numberCount">0</div>
      <div class="stat-label">Numbers</div>
    </div>

  </div>


  <!-- TABLE -->

  <div class="table-card">

    <table>

      <thead>

        <tr>
          <th>S.No</th>
          <th>Chat Time</th>
          <th>Participant Name</th>
          <th>Extracted Number</th>
          <th>Status</th>
        </tr>

      </thead>

      <tbody id="tableBody">

        <tr>

          <td colspan="5" class="empty">
            Upload a Zoom chat TXT file
          </td>

        </tr>

      </tbody>

    </table>

  </div>

</div>


<script>

/* =====================================================
   GLOBAL
===================================================== */

let records = [];


/* =====================================================
   STATUS PRIORITY
   Help > Time > Others
===================================================== */

function statusPriority(status) {

  if (status === "Help") {
    return 1;
  }

  if (status === "Time") {
    return 2;
  }

  return 3;
}


/* =====================================================
   TIME TO SECONDS
===================================================== */

function timeToSeconds(time) {

  if (!time) {
    return 0;
  }

  const parts = time.split(":").map(Number);

  if (parts.length === 2) {

    return (
      parts[0] * 3600 +
      parts[1] * 60
    );

  }

  if (parts.length === 3) {

    return (
      parts[0] * 3600 +
      parts[1] * 60 +
      parts[2]
    );

  }

  return 0;
}


/* =====================================================
   EXTRACT 10 DIGIT PHONE NUMBER
===================================================== */

function extractPhoneNumber(message) {

  if (!message) {
    return "";
  }

  const text = String(message);


  /*
    Examples supported:

    9876543210
    987 654 3210
    987-654-3210
    9876 543 210
  */

  const candidates =
    text.match(/\d[\d\s-]*\d/g) || [];


  for (const candidate of candidates) {

    const digits =
      candidate.replace(/\D/g, "");


    if (digits.length === 10) {

      return digits;

    }

  }


  /*
    Backup check
  */

  const allDigits =
    text.replace(/\D/g, "");


  const tenDigit =
    allDigits.match(/\d{10}/);


  if (tenDigit) {

    return tenDigit[0];

  }


  return "";
}


/* =====================================================
   DETECT STATUS
===================================================== */

function detectStatus(message) {

  const text =
    String(message || "");


  /*
    HELP = highest priority
  */

  if (/\bhelp\b/i.test(text)) {

    return "Help";

  }


  /*
    TIME
  */

  const timeWords =
    /time|timing|when|schedule|hour|hours|minute|minutes|start\s*time|morning|evening|night|நேரம்|மணி/i;


  if (timeWords.test(text)) {

    return "Time";

  }


  /*
    DEFAULT
  */

  return "Others";
}


/* =====================================================
   CLEAN NAME
===================================================== */

function cleanName(name) {

  if (!name) {
    return "";
  }

  return name.trim();
}


/* =====================================================
   PARSE CHAT HEADER
===================================================== */

function parseChatHeader(line) {

  if (!line) {
    return null;
  }


  /*
    Supported formats:

    19:01:04 From Ravi to Everyone:
    19:01 From Ravi to Everyone:
    [19:01:04] From Ravi to Everyone:
    19:01:04 - From Ravi to Everyone:
    19:01:04 From Ravi:
  */


  const pattern =
    /^\s*\[?\s*(\d{1,2}:\d{2}(?::\d{2})?)\s*\]?\s*(?:[-–—]\s*)?From\s+(.+?)(?:\s+to\s+[^:]+)?\s*:\s*(.*)$/i;


  const match =
    line.match(pattern);


  if (!match) {

    return null;

  }


  return {

    time: match[1],

    name: cleanName(match[2]),

    message: match[3] || ""

  };
}


/* =====================================================
   SAVE CURRENT MESSAGE
===================================================== */

function saveMessage(current, output) {

  if (!current) {
    return;
  }


  const phone =
    extractPhoneNumber(
      current.message
    );


  /*
    No phone number = ignore
  */

  if (!phone) {
    return;
  }


  const status =
    detectStatus(
      current.message
    );


  output.push({

    time: current.time,

    name: current.name,

    number: phone,

    status: status,

    message: current.message

  });
}


/* =====================================================
   PARSE ZOOM TXT
===================================================== */

function parseZoomChat(text) {

  const lines =
    text
      .replace(/\r\n/g, "\n")
      .replace(/\r/g, "\n")
      .split("\n");


  const output = [];

  let current = null;


  for (let i = 0; i < lines.length; i++) {

    const line = lines[i];


    const header =
      parseChatHeader(line);


    /*
      New chat message
    */

    if (header) {

      /*
        Save previous message
      */

      if (current) {

        saveMessage(
          current,
          output
        );

      }


      /*
        Start new message
      */

      current = {

        time: header.time,

        name: header.name,

        message: header.message

      };


      continue;
    }


    /*
      Message continuation
    */

    if (current) {

      const cleanLine =
        line.trim();


      if (cleanLine) {

        current.message +=
          " " + cleanLine;

      }

    }

  }


  /*
    Save final message
  */

  if (current) {

    saveMessage(
      current,
      output
    );

  }


  return output;
}


/* =====================================================
   REMOVE DUPLICATES
===================================================== */

function removeDuplicates(data) {

  const map =
    new Map();


  for (const item of data) {

    const old =
      map.get(item.number);


    /*
      First occurrence
    */

    if (!old) {

      map.set(
        item.number,
        item
      );

      continue;

    }


    const newPriority =
      statusPriority(
        item.status
      );


    const oldPriority =
      statusPriority(
        old.status
      );


    /*
      Priority:

      Help = 1
      Time = 2
      Others = 3
    */

    if (newPriority < oldPriority) {

      map.set(
        item.number,
        item
      );

      continue;

    }


    /*
      Same status priority
      = latest time wins
    */

    if (newPriority === oldPriority) {

      if (
        timeToSeconds(item.time) >
        timeToSeconds(old.time)
      ) {

        map.set(
          item.number,
          item
        );

      }

    }

  }


  return Array.from(
    map.values()
  );
}


/* =====================================================
   SORT BY ACTUAL SELECTED CHAT TIME
===================================================== */

function sortByChatTime(data) {

  return data.sort(
    function(a, b) {

      return (
        timeToSeconds(a.time) -
        timeToSeconds(b.time)
      );

    }
  );
}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* =====================================================
   SHOW MESSAGE
===================================================== */

function showMessage(text, type) {

  const box =
    document.getElementById(
      "messageBox"
    );


  box.textContent =
    text;


  box.className =
    "message " + type;


  box.style.display =
    "block";
}


/* =====================================================
   UPDATE STATISTICS
===================================================== */

function updateStats() {

  const help =
    records.filter(
      function(item) {
        return item.status === "Help";
      }
    ).length;


  const time =
    records.filter(
      function(item) {
        return item.status === "Time";
      }
    ).length;


  const others =
    records.filter(
      function(item) {
        return item.status === "Others";
      }
    ).length;


  document.getElementById(
    "uniqueCount"
  ).textContent =
    records.length;


  document.getElementById(
    "helpCount"
  ).textContent =
    help;


  document.getElementById(
    "timeCount"
  ).textContent =
    time;


  document.getElementById(
    "othersCount"
  ).textContent =
    others;


  document.getElementById(
    "numberCount"
  ).textContent =
    records.length;
}


/* =====================================================
   RENDER TABLE
===================================================== */

function renderTable() {

  const tbody =
    document.getElementById(
      "tableBody"
    );


  tbody.innerHTML = "";


  if (records.length === 0) {

    tbody.innerHTML = `
      <tr>
        <td colspan="5" class="empty">
          No 10-digit phone number found
        </td>
      </tr>
    `;

    updateStats();

    return;
  }


  records.forEach(
    function(item, index) {

      let statusClass =
        "others";


      if (item.status === "Help") {

        statusClass =
          "help";

      }
      else if (item.status === "Time") {

        statusClass =
          "time";

      }


      const row =
        document.createElement("tr");


      row.innerHTML = `

        <td>
          ${index + 1}
        </td>

        <td>
          ${escapeHTML(item.time)}
        </td>

        <td>
          ${escapeHTML(item.name)}
        </td>

        <td>
          ${escapeHTML(item.number)}
        </td>

        <td>
          <span class="status ${statusClass}">
            ${escapeHTML(item.status)}
          </span>
        </td>

      `;


      tbody.appendChild(row);

    }
  );


  updateStats();
}


/* =====================================================
   FILE UPLOAD
===================================================== */

document
  .getElementById("fileInput")
  .addEventListener(
    "change",
    function(event) {

      const file =
        event.target.files[0];


      if (!file) {
        return;
      }


      /*
        Read TXT
      */

      const reader =
        new FileReader();


      reader.onload =
        function(e) {

          try {

            const text =
              e.target.result;


            /*
              Parse
            */

            const parsed =
              parseZoomChat(text);


            /*
              Remove duplicates
            */

            records =
              removeDuplicates(
                parsed
              );


            /*
              IMPORTANT:
              Sort using the selected
              record's actual time.
            */

            records =
              sortByChatTime(
                records
              );


            /*
              Display
            */

            renderTable();


            /*
              Result message
            */

            if (records.length > 0) {

              showMessage(
                "File processed successfully - " +
                records.length +
                " unique numbers found.",
                "success"
              );

            }
            else {

              showMessage(
                "File opened, but no 10-digit phone number was found.",
                "error"
              );

            }

          }
          catch (error) {

            console.error(error);

            showMessage(
              "Unable to read this Zoom TXT file.",
              "error"
            );

          }

        };


      reader.onerror =
        function() {

          showMessage(
            "Unable to open the TXT file.",
            "error"
          );

        };


      reader.readAsText(file);

    }
  );


/* =====================================================
   CSV ESCAPE
===================================================== */

function csvEscape(value) {

  const text =
    String(value ?? "");


  if (
    text.includes(",") ||
    text.includes('"') ||
    text.includes("\n")
  ) {

    return '"' +
      text.replace(/"/g, '""') +
      '"';

  }


  return text;
}


/* =====================================================
   DOWNLOAD CSV
===================================================== */

function downloadCSV() {

  if (records.length === 0) {

    alert(
      "Please upload a Zoom chat TXT file first."
    );

    return;
  }


  let csv =
    "S.No,Chat Time,Participant Name,Extracted Number,Status\n";


  records.forEach(
    function(item, index) {

      csv += [
        index + 1,
        csvEscape(item.time),
        csvEscape(item.name),
        csvEscape(item.number),
        csvEscape(item.status)
      ].join(",") + "\n";

    }
  );


  const blob =
    new Blob(
      [csv],
      {
        type: "text/csv;charset=utf-8;"
      }
    );


  const url =
    URL.createObjectURL(blob);


  const link =
    document.createElement("a");


  link.href =
    url;


  link.download =
    "zoom_chat_extracted.csv";


  document.body.appendChild(link);

  link.click();

  document.body.removeChild(link);


  URL.revokeObjectURL(url);
}

</script>

</body>
</html>
