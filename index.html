<body>

<div class="container">

  <header>
    <img src="./favicon.ico?v=5" alt="Zoom Chat Extractor">

    <div>
      <h1>Zoom Chat Extractor</h1>
      <p>Upload Zoom chat TXT file and extract unique phone numbers</p>
    </div>
  </header>

  <div class="upload-box">

    <label for="fileInput">Select Zoom Chat TXT File</label>

    <input
      type="file"
      id="fileInput"
      accept=".txt,text/plain"
    >

    <div id="messageBox" class="message"></div>

    <div class="buttons">

      <button class="btn-primary" onclick="downloadCSV()">
        Download CSV
      </button>

      <button class="btn-secondary" onclick="window.print()">
        Print / Save PDF
      </button>

    </div>

  </div>

  <div class="stats">

    <div class="stat">
      <div class="number" id="uniqueCount">0</div>
      <div class="label">Unique Rows</div>
    </div>

    <div class="stat">
      <div class="number" id="helpCount">0</div>
      <div class="label">Help</div>
    </div>

    <div class="stat">
      <div class="number" id="timeCount">0</div>
      <div class="label">Time</div>
    </div>

    <div class="stat">
      <div class="number" id="othersCount">0</div>
      <div class="label">Others</div>
    </div>

    <div class="stat">
      <div class="number" id="numberCount">0</div>
      <div class="label">Numbers</div>
    </div>

  </div>

  <div class="table-box">

    <table>

      <thead>
        <tr>
          <th>S.No</th>
          <th>Chat Time</th>
          <th>Participant Name</th>
          <th>Extracted Number</th>
          <th>Status</th>
        </tr>
      </thead>

      <tbody id="tableBody">

        <tr>
          <td colspan="5" class="empty">
            Upload a Zoom chat TXT file to see the results
          </td>
        </tr>

      </tbody>

    </table>

  </div>

</div>

<script>

let records = [];


/* =========================
   TIME WORDS
========================= */

const timeWords =
  /\b(time|when|what time|timing|clock|hour|hours|minute|minutes|class start|start time|start|schedule|நேரம்|மணி)\b/i;


/* =========================
   STATUS PRIORITY
========================= */

function statusPriority(status) {

  if (status === "Help") return 1;

  if (status === "Time") return 2;

  return 3;
}


/* =========================
   TIME TO SECONDS
========================= */

function timeToSeconds(time) {

  const parts =
    String(time).split(":").map(Number);

  if (parts.length === 2) {
    return parts[0] * 3600 +
           parts[1] * 60;
  }

  if (parts.length === 3) {
    return parts[0] * 3600 +
           parts[1] * 60 +
           parts[2];
  }

  return 0;
}


/* =========================
   PHONE NUMBER EXTRACTION
========================= */

function getNumber(message) {

  const text =
    String(message || "");

  /*
    Supports:
    9876543210
    98765 43210
    98765-43210
    +91 9876543210
    +91-9876543210
    91 9876543210
  */

  const patterns = [

    /(?:\+?91[\s-]?)?(\d{5}[\s-]?\d{5})\b/g,

    /\b(\d{10})\b/g

  ];


  for (const pattern of patterns) {

    const matches =
      [...text.matchAll(pattern)];

    for (const match of matches) {

      const digits =
        match[1].replace(/\D/g, "");

      if (digits.length === 10) {
        return digits;
      }
    }
  }


  return "";
}


/* =========================
   STATUS
========================= */

function getStatus(message) {

  const text =
    String(message || "");

  if (/\bhelp\b/i.test(text)) {
    return "Help";
  }

  if (timeWords.test(text)) {
    return "Time";
  }

  return "Others";
}


/* =========================
   MAKE RECORD
========================= */

function makeRecord(time, name, message) {

  const number =
    getNumber(message);

  if (!number) {
    return null;
  }

  return {

    time: String(time || "").trim(),

    name: String(name || "")
      .trim(),

    number: number,

    status: getStatus(message)

  };
}


/* =========================
   ZOOM HEADER PARSER
========================= */

function parseHeader(line) {

  /*
    Format 1:
    10:25:30 From John Doe to Everyone: 9876543210

    Format 2:
    10:25 From John Doe to Everyone: 9876543210

    Format 3:
    [10:25:30] From John Doe to Everyone: 9876543210

    Format 4:
    10:25:30 From John Doe to Everyone privately: 9876543210
  */

  const pattern =
    /^(?:\[)?(\d{1,2}:\d{2}(?::\d{2})?)(?:\])?\s*(?:[-–—]\s*)?From\s+(.+?)\s+to\s+.+?:\s*(.*)$/i;

  const match =
    line.match(pattern);

  if (!match) {
    return null;
  }

  return {

    time: match[1],

    name: match[2],

    message: match[3] || ""

  };
}


/* =========================
   ALTERNATIVE HEADER
========================= */

function parseAlternativeHeader(line) {

  /*
    Supports:
    10:25:30 John Doe: message
    10:25 John Doe: message
  */

  const pattern =
    /^(?:\[)?(\d{1,2}:\d{2}(?::\d{2})?)(?:\])?\s+(.+?):\s*(.*)$/;

  const match =
    line.match(pattern);

  if (!match) {
    return null;
  }

  const possibleName =
    match[2].trim();

  /*
    Avoid treating random time/text lines as chat headers.
  */

  if (
    /^from\b/i.test(possibleName) ||
    /^to\b/i.test(possibleName)
  ) {
    return null;
  }

  return {

    time: match[1],

    name: possibleName,

    message: match[3] || ""

  };
}


/* =========================
   PARSE ZOOM CHAT
========================= */

function parseChat(text) {

  const lines =
    String(text)
      .replace(/\r\n/g, "\n")
      .replace(/\r/g, "\n")
      .split("\n");


  const data = [];

  let current = null;


  for (let i = 0; i < lines.length; i++) {

    const line =
      lines[i].trim();


    if (!line) {
      continue;
    }


    let match =
      parseHeader(line);


    if (!match) {
      match =
        parseAlternativeHeader(line);
    }


    if (match) {

      /*
        Save previous message
      */

      if (current) {

        const record =
          makeRecord(
            current.time,
            current.name,
            current.message
          );

        if (record) {
          data.push(record);
        }
      }


      /*
        Start new message
      */

      current = {

        time: match.time,

        name: match.name,

        message: match.message

      };

    }

    else if (current) {

      /*
        Continuation line
      */

      current.message +=
        " " + line;

    }

  }


  /*
    Save final message
  */

  if (current) {

    const record =
      makeRecord(
        current.time,
        current.name,
        current.message
      );

    if (record) {
      data.push(record);
    }
  }


  return data;
}


/* =========================
   REMOVE DUPLICATES
========================= */

function removeDuplicates(data) {

  const map =
    new Map();


  for (const item of data) {

    const existing =
      map.get(item.number);


    if (!existing) {

      map.set(
        item.number,
        item
      );

      continue;
    }


    const newPriority =
      statusPriority(item.status);

    const oldPriority =
      statusPriority(existing.status);


    /*
      Help > Time > Others
    */

    if (newPriority < oldPriority) {

      map.set(
        item.number,
        item
      );

    }

    else if (
      newPriority === oldPriority
    ) {

      if (
        timeToSeconds(item.time) >
        timeToSeconds(existing.time)
      ) {

        map.set(
          item.number,
          item
        );
      }

    }

  }


  return Array.from(
    map.values()
  );
}


/* =========================
   SORT
========================= */

function sortByChatTime(data) {

  return data.sort(
    function(a, b) {

      return (
        timeToSeconds(a.time) -
        timeToSeconds(b.time)
      );

    }
  );
}


/* =========================
   RENDER
========================= */

function render() {

  const tbody =
    document.getElementById(
      "tableBody"
    );


  tbody.innerHTML = "";


  if (records.length === 0) {

    tbody.innerHTML = `
      <tr>
        <td colspan="5" class="empty">
          No phone numbers found
        </td>
      </tr>
    `;

    updateStats();

    return;
  }


  records.forEach(
    function(item, index) {

      const row =
        document.createElement("tr");


      let statusClass =
        "status-others";


      if (item.status === "Help") {

        statusClass =
          "status-help";

      }

      else if (item.status === "Time") {

        statusClass =
          "status-time";

      }


      row.innerHTML = `

        <td>${index + 1}</td>

        <td>
          ${escapeHtml(item.time)}
        </td>

        <td>
          ${escapeHtml(item.name)}
        </td>

        <td>
          ${escapeHtml(item.number)}
        </td>

        <td>
          <span class="status ${statusClass}">
            ${escapeHtml(item.status)}
          </span>
        </td>

      `;


      tbody.appendChild(row);

    }
  );


  updateStats();
}


/* =========================
   STATS
========================= */

function updateStats() {

  const help =
    records.filter(
      item => item.status === "Help"
    ).length;


  const time =
    records.filter(
      item => item.status === "Time"
    ).length;


  const others =
    records.filter(
      item => item.status === "Others"
    ).length;


  document.getElementById(
    "uniqueCount"
  ).textContent =
    records.length;


  document.getElementById(
    "helpCount"
  ).textContent =
    help;


  document.getElementById(
    "timeCount"
  ).textContent =
    time;


  document.getElementById(
    "othersCount"
  ).textContent =
    others;


  document.getElementById(
    "numberCount"
  ).textContent =
    records.length;
}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value) {

  return String(value)

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");
}


/* =========================
   SHOW MESSAGE
========================= */

function showMessage(text, type) {

  const box =
    document.getElementById(
      "messageBox"
    );


  box.textContent =
    text;


  box.className =
    "message " + type;
}


/* =========================
   FILE UPLOAD
========================= */

document
  .getElementById("fileInput")
  .addEventListener(
    "change",
    function(event) {

      const file =
        event.target.files[0];


      if (!file) {
        return;
      }


      showMessage(
        "Reading file...",
        "success"
      );


      const reader =
        new FileReader();


      reader.onload =
        function(e) {

          try {

            const text =
              e.target.result;


            const parsed =
              parseChat(text);


            records =
              removeDuplicates(
                parsed
              );


            records =
              sortByChatTime(
                records
              );


            render();


            if (
              records.length > 0
            ) {

              showMessage(
                "Successfully extracted " +
                records.length +
                " unique phone number(s).",
                "success"
              );

            }

            else {

              showMessage(
                "File uploaded, but no 10-digit phone number was found. Please check the Zoom TXT format.",
                "error"
              );

            }


          }

          catch (error) {

            console.error(error);


            records = [];


            render();


            showMessage(
              "Unable to process this file.",
              "error"
            );

          }

        };


      reader.onerror =
        function() {

          showMessage(
            "Unable to read the selected file.",
            "error"
          );

        };


      /*
        UTF-8 is the normal Zoom TXT encoding.
        Browser handles the selected TXT locally.
      */

      reader.readAsText(
        file,
        "UTF-8"
      );

    }
  );


/* =========================
   DOWNLOAD CSV
========================= */

function downloadCSV() {

  if (records.length === 0) {

    alert(
      "Please upload a Zoom chat TXT file first."
    );

    return;
  }


  let csv =
    "S.No,Chat Time,Participant Name,Extracted Number,Status\n";


  records.forEach(
    function(item, index) {

      csv += [

        index + 1,

        csvEscape(item.time),

        csvEscape(item.name),

        csvEscape(item.number),

        csvEscape(item.status)

      ].join(",") + "\n";

    }
  );


  /*
    UTF-8 BOM helps Excel display
    characters correctly.
  */

  const blob =
    new Blob(
      [
        "\uFEFF" + csv
      ],
      {
        type:
          "text/csv;charset=utf-8;"
      }
    );


  const url =
    URL.createObjectURL(blob);


  const a =
    document.createElement("a");


  a.href = url;


  a.download =
    "zoom_chat_extracted.csv";


  document.body.appendChild(a);


  a.click();


  document.body.removeChild(a);


  URL.revokeObjectURL(url);
}


/* =========================
   CSV ESCAPE
========================= */

function csvEscape(value) {

  const text =
    String(value ?? "");


  if (
    text.includes(",") ||
    text.includes('"') ||
    text.includes("\n")
  ) {

    return '"' +
      text.replace(
        /"/g,
        '""'
      ) +
      '"';

  }


  return text;
}

</script>

</body>
