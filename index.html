<body>

<script>

let records=[];


/* =========================================
   STATUS WORDS
========================================= */

const timeWords =
/\b(time|when|what time|timing|clock|hour|hours|minute|minutes|class start|start time|start|schedule|நேரம்|மணி)\b/i;


/* =========================================
   TIME
========================================= */

function timeToSeconds(time){

const m=String(time).match(
/(\d{1,2}):(\d{2})(?::(\d{2}))?/
);

if(!m)return 0;

return Number(m[1])*3600+
Number(m[2])*60+
Number(m[3]||0);

}


/* =========================================
   PHONE NUMBER
========================================= */

function getNumber(text){

text=String(text||"");


/*
Indian mobile numbers:
9876543210
98765 43210
98765-43210
+91 9876543210
+91-9876543210
91 9876543210
*/

const patterns=[

/(?:\+?91[\s-]?)?([6-9]\d{4}[\s-]?\d{5})\b/g,

/\b([6-9]\d{9})\b/g,

/\b(\d{10})\b/g,

/\b(\d{5}[\s-]\d{5})\b/g

];


for(const regex of patterns){

const matches=[...text.matchAll(regex)];

for(const m of matches){

let number=
(m[1]||"")
.replace(/\D/g,"");

if(number.length===10){

if(number.startsWith("91") &&
number.length===10){

return number;
}

return number;
}

}

}

return "";

}


/* =========================================
   STATUS
========================================= */

function getStatus(message){

const text=String(message||"");

if(/\bhelp\b/i.test(text)){
return "Help";
}

if(timeWords.test(text)){
return "Time";
}

return "Others";

}


/* =========================================
   CREATE RECORD
========================================= */

function makeRecord(time,name,message){

const number=getNumber(message);

if(!number)return null;

return{

time:String(time||""),

name:String(name||"").trim(),

number:number,

status:getStatus(message)

};

}


/* =========================================
   HEADER DETECTION
========================================= */

function detectHeader(line){

line=line.trim();


/*
Zoom:

10:25:30 From John to Everyone: message

10:25 From John to Everyone: message

[10:25:30] From John to Everyone: message

10:25:30 John: message

10:25 John: message
*/


let m=line.match(
/^\[?(\d{1,2}:\d{2}(?::\d{2})?)\]?\s*(?:-|–|—)?\s*From\s+(.+?)\s+to\s+.+?:\s*(.*)$/i
);

if(m){

return{

time:m[1],

name:m[2],

message:m[3]||""

};

}


/*
Alternative format
*/

m=line.match(
/^\[?(\d{1,2}:\d{2}(?::\d{2})?)\]?\s+(.+?):\s*(.*)$/
);

if(m){

return{

time:m[1],

name:m[2],

message:m[3]||""

};

}


/*
Dash format

10:25:30 - John: message
*/

m=line.match(
/^\[?(\d{1,2}:\d{2}(?::\d{2})?)\]?\s*[-–—]\s*(.+?):\s*(.*)$/
);

if(m){

return{

time:m[1],

name:m[2],

message:m[3]||""

};

}

return null;

}


/* =========================================
   NUMBER-ONLY LINE
========================================= */

function isPhoneLine(line){

return !!getNumber(line);

}


/* =========================================
   PARSE CHAT
========================================= */

function parseChat(text){

/*
Remove UTF-8 BOM
*/

text=String(text)
.replace(/^\uFEFF/,"")
.replace(/\u0000/g,"");


const lines=
text
.replace(/\r\n/g,"\n")
.replace(/\r/g,"\n")
.split("\n");


const data=[];

let current=null;


for(let i=0;i<lines.length;i++){

const raw=lines[i];

const line=raw.trim();

if(!line)continue;


const header=detectHeader(line);


/*
New message
*/

if(header){

/*
save previous
*/

if(current){

const record=
makeRecord(
current.time,
current.name,
current.message
);

if(record)data.push(record);

}


/*
new record
*/

current={

time:header.time,

name:header.name,

message:header.message

};

continue;

}


/*
Continuation line
*/

if(current){

current.message+=" "+line;

}

}


/*
Final record
*/

if(current){

const record=
makeRecord(
current.time,
current.name,
current.message
);

if(record)data.push(record);

}


return data;

}


/* =========================================
   FALLBACK SCANNER
========================================= */

function fallbackScan(text){

const lines=
String(text)
.replace(/\r\n/g,"\n")
.replace(/\r/g,"\n")
.split("\n");


const data=[];


for(let i=0;i<lines.length;i++){

const line=lines[i].trim();

if(!line)continue;


const number=getNumber(line);

if(!number)continue;


let time="";

let name="";

const timeMatch=
line.match(
/\b(\d{1,2}:\d{2}(?::\d{2})?)\b/
);

if(timeMatch){

time=timeMatch[1];

}


/*
Try to get name after From
*/

const fromMatch=
line.match(
/From\s+(.+?)\s+to\b/i
);

if(fromMatch){

name=fromMatch[1].trim();

}


/*
If no name found,
use text before phone number
*/

if(!name){

let temp=line
.replace(number,"")
.trim();

name=temp
.replace(
/^\[?\d{1,2}:\d{2}(?::\d{2})?\]?\s*/,
""
)
.trim();

}


data.push({

time:time,

name:name,

number:number,

status:getStatus(line)

});

}


return data;

}


/* =========================================
   DUPLICATE REMOVAL
========================================= */

function statusPriority(status){

if(status==="Help")return 1;

if(status==="Time")return 2;

return 3;

}


function removeDuplicates(data){

const map=new Map();


for(const item of data){

const existing=
map.get(item.number);


if(!existing){

map.set(item.number,item);

continue;

}


const newPriority=
statusPriority(item.status);

const oldPriority=
statusPriority(existing.status);


/*
Help > Time > Others
*/

if(newPriority<oldPriority){

map.set(item.number,item);

}

else if(newPriority===oldPriority){

if(
timeToSeconds(item.time)>
timeToSeconds(existing.time)
){

map.set(item.number,item);

}

}

}


return Array.from(map.values());

}


/* =========================================
   SORT
========================================= */

function sortByChatTime(data){

return data.sort(
(a,b)=>
timeToSeconds(a.time)-
timeToSeconds(b.time)
);

}


/* =========================================
   RENDER
========================================= */

function render(){

const tbody=
document.getElementById("tableBody");

tbody.innerHTML="";


if(records.length===0){

tbody.innerHTML=`

<tr>

<td colspan="5" class="empty">

No phone numbers found

</td>

</tr>

`;

updateStats();

return;

}


records.forEach((item,index)=>{

const row=
document.createElement("tr");


let statusClass=
"status-others";


if(item.status==="Help"){

statusClass="status-help";

}

else if(item.status==="Time"){

statusClass="status-time";

}


row.innerHTML=`

<td>${index+1}</td>

<td>${escapeHtml(item.time)}</td>

<td>${escapeHtml(item.name)}</td>

<td>${escapeHtml(item.number)}</td>

<td>

<span class="status ${statusClass}">

${escapeHtml(item.status)}

</span>

</td>

`;


tbody.appendChild(row);

});


updateStats();

}


/* =========================================
   STATS
========================================= */

function updateStats(){

const help=
records.filter(
x=>x.status==="Help"
).length;


const time=
records.filter(
x=>x.status==="Time"
).length;


const others=
records.filter(
x=>x.status==="Others"
).length;


document.getElementById(
"uniqueCount"
).textContent=
records.length;


document.getElementById(
"helpCount"
).textContent=
help;


document.getElementById(
"timeCount"
).textContent=
time;


document.getElementById(
"othersCount"
).textContent=
others;


document.getElementById(
"numberCount"
).textContent=
records.length;

}


/* =========================================
   HTML ESCAPE
========================================= */

function escapeHtml(value){

return String(value)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}


/* =========================================
   MESSAGE
========================================= */

function showMessage(text,type){

const box=
document.getElementById("messageBox");

box.textContent=text;

box.className=
"message "+type;

}


/* =========================================
   FILE UPLOAD
========================================= */

document
.getElementById("fileInput")
.addEventListener(
"change",
function(event){

const file=
event.target.files[0];


if(!file)return;


showMessage(
"Reading document...",
"success"
);


const reader=
new FileReader();


reader.onload=function(e){

try{

const text=e.target.result;


/*
FIRST:
Normal Zoom parser
*/

let parsed=
parseChat(text);


/*
SECOND:
If normal parser didn't find
anything, use fallback scanner
*/

if(parsed.length===0){

parsed=
fallbackScan(text);

}


/*
Remove duplicates
*/

records=
removeDuplicates(parsed);


/*
Sort
*/

records=
sortByChatTime(records);


/*
Render
*/

render();


if(records.length>0){

showMessage(
"Successfully extracted "+
records.length+
" unique phone number(s).",
"success"
);

}

else{

showMessage(
"File was read successfully, but no 10-digit phone number was detected.",
"error"
);

}


}

catch(error){

console.error(error);

records=[];

render();

showMessage(
"Unable to process this file.",
"error"
);

}

};


reader.onerror=function(){

showMessage(
"Unable to read this file.",
"error"
);

};


reader.readAsText(
file,
"UTF-8"
);

}
);


/* =========================================
   CSV DOWNLOAD
========================================= */

function downloadCSV(){

if(records.length===0){

alert(
"Please upload a Zoom chat TXT file first."
);

return;

}


let csv=
"S.No,Chat Time,Participant Name,Extracted Number,Status\n";


records.forEach((item,index)=>{

csv+=
[
index+1,
csvEscape(item.time),
csvEscape(item.name),
csvEscape(item.number),
csvEscape(item.status)
]
.join(",")+
"\n";

});


const blob=
new Blob(
[
"\uFEFF"+csv
],
{
type:
"text/csv;charset=utf-8;"
}
);


const url=
URL.createObjectURL(blob);


const a=
document.createElement("a");


a.href=url;

a.download=
"zoom_chat_extracted.csv";


document.body.appendChild(a);

a.click();

document.body.removeChild(a);

URL.revokeObjectURL(url);

}


/* =========================================
   CSV ESCAPE
========================================= */

function csvEscape(value){

const text=
String(value??"");


if(
text.includes(",")||
text.includes('"')||
text.includes("\n")
){

return '"'+
text.replace(/"/g,'""')+
'"';

}

return text;

}

</script>
